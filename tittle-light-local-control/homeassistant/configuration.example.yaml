# Example Home Assistant integration for tittle.py (Home Assistant OS / container: copy src/ to /config/tittle/, put your cube's address in /config/tittle/tittle.host).
# Merge these blocks into configuration.yaml (they are separate top-level keys), run a config check, then "Reload all YAML" (a new command_line key needs a restart once).

shell_command:
  # colour: tittle_set with r, g, b, i (0-255 each, i = intensity, 0 = off)
  tittle_set: "python3 /config/tittle/tittle.py {{ r }} {{ g }} {{ b }} {{ i }}"
  # one built-in item or one of your pictures, by name; level 0-255; the six numbers are the LOCAL time and date (the clock items need them)
  tittle_show: "python3 /config/tittle/tittle.py show \"{{ name }}\" {{ level }} {{ now().strftime('%H %M %S %y %m %d') }}"
  # what the open alert keys call for (rules in alerts.json); "force" re-sends even when it believes it is already showing
  tittle_alert: "python3 /config/tittle/tittle.py alert \"{{ keys }}\" 255 {{ now().strftime('%H %M %S %y %m %d') }}{{ ' force' if force | default(false) else '' }}"
  # a JSON drawing for a language model (travels base64-encoded; see docs/LLM.md)
  tittle_draw: "python3 /config/tittle/tittle.py draw {{ spec_b64 }} {{ brightness | default(255) }}"

command_line:
  # is the cube answering on its control port? Going from off to on is the moment to re-send the clock (it forgets the time in a power failure)
  - binary_sensor:
      name: Tittle cube reachable
      unique_id: tittle_cube_reachable
      command: "python3 /config/tittle/tittle.py ping"
      payload_on: "on"
      payload_off: "off"
      device_class: connectivity
      scan_interval: 30
  # the items and pictures grouped by section (a two-level pick: the group first, then the item), for the two selects below (tittle.py list reads src/modes.tsv and src/pictures/)
  - sensor:
      name: Tittle modes
      unique_id: tittle_modes
      command: "python3 /config/tittle/tittle.py list"
      scan_interval: 86400
      value_template: "{{ value_json.names | length }}"
      json_attributes:
        - groups

input_number:
  tittle_show_brightness:
    name: Tittle Show brightness
    min: 10
    max: 255
    step: 5
    mode: slider

template:
  - select:
      # first the group (Clock, Emoji: Weather, ...); picking a group only fills the item list below
      - name: Tittle group
        unique_id: tittle_show
        options: "{{ (state_attr('sensor.tittle_modes', 'groups') or {}) | list }}"
        optimistic: true
        select_option: []
      # then the item; picking it shows it at once
      - name: Tittle item
        unique_id: tittle_item
        options: "{{ (state_attr('sensor.tittle_modes', 'groups') or {}).get(states('select.tittle_show'), []) }}"
        optimistic: true
        select_option:
          - action: shell_command.tittle_show
            data:
              name: "{{ states('select.tittle_show') }} / {{ option }}"
              level: "{{ states('input_number.tittle_show_brightness') | int(255) }}"

# ---- a script a language model can call (a text field "spec" and an optional "brightness"); it returns {"result": "ok"} or the error text ----
